name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      date: ${{ steps.metadata.outputs.date }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from release import release_version
          tag = release_version(os.environ["RELEASE_TAG"])
          info = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--repo", os.environ["GITHUB_REPOSITORY"], "--json", "isDraft,isPrerelease"], text=True))
          if info["isDraft"]:
              raise SystemExit("release must be published")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tagged = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          if tagged != commit:
              raise SystemExit("checkout does not match the release tag")
          date = subprocess.check_output(["git", "show", "-s", "--format=%cI", "HEAD"], text=True).strip()
          prerelease = "true" if info["isPrerelease"] or "-" in tag else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\ncommit={commit}\ndate={date}\nprerelease={prerelease}\n")
          PY
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go test -race ./...
      - name: Build native archive
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          LEND_COMMIT: ${{ needs.prepare.outputs.commit }}
          LEND_DATE: ${{ needs.prepare.outputs.date }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/release.py build --version "$RELEASE_TAG" --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  upload:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and Homebrew formula
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/release.py finalize --version "$RELEASE_TAG"
          cd dist
          sha256sum --check checksums.txt
          ruby -c lend.rb
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          # Fill in the standard notes only when the release was published without any.
          body=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file docs/release-notes.md
          fi
  homebrew:
    needs: [prepare, upload]
    if: needs.prepare.outputs.prerelease == 'false'
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
