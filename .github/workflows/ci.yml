name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            go: stable
          - runner: ubuntu-24.04-arm
            go: stable
          - runner: macos-15
            go: stable
          - runner: macos-15-intel
            go: stable
          - runner: ubuntu-24.04
            go: 1.24.x
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        shell: bash
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -buildvcs=false -o bin/lend ./cmd/lend
      - run: bin/lend version --json
      - name: Installer and packaging tests
        run: |
          sh -n install.sh
          python3 -m unittest discover -s scripts/tests -v
